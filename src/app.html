<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f9f5ed" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tarkeebi" />
		<script>
			// Apply the saved theme before first paint to avoid a flash of the wrong theme.
			try {
				var stored = localStorage.getItem('tarkeebi:theme');
				var dark =
					stored === 'dark' ||
					((stored === null || stored === 'system') &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
